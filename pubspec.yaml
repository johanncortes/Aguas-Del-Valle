name: aguas_monte_patria
description: "Water Meter Reader MVP for Aguas del Valle - Monte Patria"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Mapping
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Excel Export
  excel: ^4.0.6

  # File System & Sharing
  path_provider: ^2.1.5
  share_plus: ^10.1.4

  # UI & Fonts
  intl: ^0.20.2
  dio: ^5.11.0
  dio_cache_interceptor: ^4.0.7
  uuid: ^4.6.0
  geolocator: ^14.0.2
  file_picker: ^11.0.3
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  geolocator_platform_interface: ^4.2.0
  image_picker_platform_interface: ^2.11.0
  path_provider_platform_interface: ^2.1.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# App icon. Source images are generated by tool/generate_app_icon.py.
# Regenerate the native icons with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true # App Store rejects icons with an alpha channel
  # Android 8+ adaptive icon: same drop on the brand blue, kept inside the
  # safe zone so launchers can crop it to any shape
  adaptive_icon_background: "#0D47A1"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"
